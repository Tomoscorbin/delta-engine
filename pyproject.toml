[project]
name = "delta-engine"
description = "Framework for defining, validating, and evolving tables in a consistent, safe, and controlled way."
authors = [{ name = "Tomos Corbin", email = "tomoscorbin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "delta-lake",
  "databricks",
  "schema",
  "migrations",
  "ddl",
  "data-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
dynamic = ["version"]
# Runtime dependencies are intentionally empty: the schema/planning surface is
# pure Python. pyspark/delta-spark are dev-only (see [dependency-groups]) so the
# library can be imported to define and plan tables without a Spark install.
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=4.0.0", "delta-spark>=4.0.0"]
sql = ["databricks-sql-connector>=4.0.0"]

[project.urls]
Homepage = "https://github.com/Tomoscorbin/delta-engine"
Repository = "https://github.com/Tomoscorbin/delta-engine"
Documentation = "https://tomoscorbin.github.io/delta-engine/"
Issues = "https://github.com/Tomoscorbin/delta-engine/issues"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=5.0",
  "ruff>=0.12.9",
  "mypy>=1.17.1",
  "pyspark>=4.0.0",
  "delta-spark>=4.0.0",
  "hypothesis>=6.155.5",
  "import-linter>=2.13",
  "commitizen>=4.0",
  "pre-commit>=3.7",
  "databricks-sql-connector>=4.0.0",
  "databricks-sdk>=0.70.0",
]
docs = [
  "sphinx>=8.0",
  "furo>=2024.1.29",
  "myst-parser>=4.0",
  "sphinx-copybutton>=0.5",
  "sphinx-autodoc-typehints>=2.0",
  "sphinxcontrib-mermaid>=1.0",
  "sphinx-autoapi>=3.8.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>\\d+\\.\\d+\\.\\d+)"
fallback-version = "0.0.0"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
changelog_incremental = true
annotated_tag = true

[tool.hatch.build.targets.wheel]
packages = ["src/delta_engine"]

# -------------------- Ruff  --------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".tox",
  "dist",
  "build",
  ".mypy_cache",
  ".ruff_cache",
  "docs",
]
fix = false
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# E,F: pyflakes/pycodestyle; N: pep8-naming; I: isort; UP: pyupgrade; B: bugbear; RUF: extras; TID: tidy-imports
select = ["E", "W", "F", "N", "I", "UP", "B", "RUF", "TID", "D"]
ignore = [
  "E203", # slice spacing (compatible with ruff-format/black)
  "E266", # allow long inline comments
  "D104", # don't require package docstrings in __init__.py
  "D105", # magic methods implement named protocols (len/iter/bool); the protocol documents them
  "D107", # don't require docstrings on __init__ methods
  "D212", # don't require multi-line docstring summary to start at the first line
  "D203", # no blank line before docstring
]

# isort behavior for import sorting
[tool.ruff.lint.isort]
known-first-party = ["delta_engine"]
force-sort-within-sections = true
combine-as-imports = true

# Tidy imports
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # enforce absolute imports (TID252)

# Test file exceptions (short fixture names etc.)
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "N802", # allow non-PEP8 function names
  "N803", # allow non-PEP8 argument names
  "N806", # allow non-PEP8 variable names
  "D101", # don't require docstring in public classes
  "D102", # don't require docstrings in public methods
  "D103", # don't require docstrings in public
  "D105", # don't require docstrings in magic methods
  "D100", # don't require module docstrings
  "D205", # don't require 1 blank line between summary line and description
  "N815", # allow variables in class scope to be mixedCase
  "N812", # allow uppercase variable names
]
# Value-object modules: each class is documented and the contract lives on the
# abstract method (Action.subject, Failure.format_lines) or, for diff changes,
# on the module docstring's description of actions(). Concrete overrides only
# restate it, so we don't require a docstring on every override.
"src/delta_engine/domain/plan/actions.py" = ["D102"]
"src/delta_engine/application/failures.py" = ["D102"]
"src/delta_engine/domain/plan/diff.py" = ["D102"]
# Example notebooks in Databricks source format. Databricks injects `spark`,
# `dbutils`, and `display` at runtime; the first line must be the notebook
# header (so no module docstring); imports follow cell markers, not the file top.
"notebooks/**" = [
  "F821", # Databricks injects `spark`, `dbutils`, and `display` at runtime
  "F401", # the intro cell imports the public surface up-front; cells below use it
  "D100", # first line must be `# Databricks notebook source`, so no module docstring
  "D103", # notebook-local helper functions don't need docstrings
  "E402", # imports follow cell markers, not the true top of the module
  "N812", # `import pyspark.sql.types as T` is the canonical PySpark alias
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "local_e2e: local Spark/Delta end-to-end tests that run in default CI",
  "databricks_e2e: credentialed Databricks/Unity Catalog end-to-end tests",
]
addopts = """
--cov
--cov-report=term-missing:skip-covered
--cov-report=xml:reports/coverage.xml
"""

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.coverage.run]
branch = true
source = ["delta_engine"]


# -------------------- Import Linter --------------------

[tool.importlinter]
root_package = "delta_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "hexagonal-layers"
name = "Hexagonal package layers"
type = "layers"
containers = ["delta_engine"]
layers = ["databricks | schema | adapters | api", "application", "domain"]
exhaustive = true
ignore_imports = [
  # Public Databricks facade; implementation remains in adapters.
  "delta_engine.databricks -> delta_engine.adapters.databricks.spark.factory",
  "delta_engine.databricks -> delta_engine.adapters.databricks.warehouse.factory",
  "delta_engine.databricks -> delta_engine.adapters.databricks.log_config",
  # Public schema facade: DeltaTable/ForeignKey/Self live in api.delta_table
  # (same layer, so the facade edge is exempted). Property is imported downward
  # from application.properties, which the layer order already permits.
  "delta_engine.schema -> delta_engine.api.delta_table",
]

[[tool.importlinter.contracts]]
id = "backend-imports-stay-in-adapters"
name = "Backend imports stay in adapters"
type = "forbidden"
source_modules = [
  "delta_engine.schema",
  "delta_engine.api",
  "delta_engine.application",
  "delta_engine.domain",
]
forbidden_modules = ["delta", "pyspark"]

[[tool.importlinter.contracts]]
id = "shared-sql-core-is-backend-free"
name = "Shared SQL core stays PySpark-free"
type = "forbidden"
source_modules = ["delta_engine.adapters.databricks.sql"]
forbidden_modules = ["delta", "pyspark", "py4j"]

[[tool.importlinter.contracts]]
id = "databricks-backends-above-shared-sql"
name = "Databricks backends sit above the shared SQL core"
type = "layers"
containers = ["delta_engine.adapters.databricks"]
layers = ["spark | warehouse", "sql"]

[[tool.importlinter.contracts]]
id = "warehouse-backend-is-pyspark-free"
name = "Warehouse backend stays PySpark-free"
type = "forbidden"
source_modules = ["delta_engine.adapters.databricks.warehouse"]
forbidden_modules = ["delta", "pyspark", "py4j"]


# -------------------- MyPy --------------------

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
strict_equality = true
# Example notebooks rely on Databricks-injected globals (spark, dbutils, display)
# and are run on a cluster, not type-checked here. Excluding them keeps the
# library's own type-checking strict without fighting the runtime environment.
exclude = ["^notebooks/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# CI type-checks in the dev environment, where the docs group (and therefore
# sphinx) is not installed; docs/conf.py imports Sphinx for its hook signatures.
[[tool.mypy.overrides]]
module = ["sphinx.*"]
ignore_missing_imports = true
