name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime package only
        run: uv sync --locked --no-dev

      - name: Import public package without dev dependencies
        run: |
          uv run --no-dev python - <<'PY'
          from delta_engine import Engine
          from delta_engine.schema import Column, DeltaTable, Integer, String

          table = DeltaTable(
              catalog="dev",
              schema="silver",
              name="customers",
              columns=[
                  Column("id", Integer(), nullable=False),
                  Column("name", String(), nullable=True),
              ],
              primary_key=["id"],
          )

          desired = table.to_desired_table()

          assert desired.qualified_name.catalog == "dev"
          assert desired.qualified_name.schema == "silver"
          assert desired.qualified_name.name == "customers"
          assert table.primary_key == ("id",)
          assert Engine is not None
          PY

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Type check
        run: uv run mypy .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check import architecture
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Test
        run: uv run pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run sphinx-build -W -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distributions
        run: |
          uv run --no-project --python 3.12 python scripts/validate_distribution.py \
            --dist-dir dist

      - name: Upload failed distributions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-distributions
          path: |
            dist/
            build/distribution.sha256
            build/distribution.version
          if-no-files-found: ignore
