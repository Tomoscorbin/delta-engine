name: Release

# Releases are on-demand. Commits accumulate on main between releases; cutting a
# release rolls up everything since the last one into a single version bump.
#
# Run this workflow from the Actions tab:
#   - "tag" blank        -> cut a NEW release: commitizen bumps from accumulated
#                           commits, tags, updates the changelog, builds, and
#                           publishes to PyPI + GitHub Releases.
#   - "tag" set          -> publish an EXISTING tag as-is (recovery / re-publish),
#                           with no bump (e.g. tag = v0.1.0).
#   - "dry_run" checked  -> preview the new-release version without publishing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish as-is, e.g. v0.1.0. Blank = cut a new release."
        required: false
        default: ""
      dry_run:
        description: "Preview the new-release version bump without publishing."
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit + tag after validation
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for commitizen and hatch-vcs

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"   # re-publish an existing tag
            echo "bump=false"    >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"   # preview only
            echo "bump=false"    >> "$GITHUB_OUTPUT"
          else
            echo "publish=true"  >> "$GITHUB_OUTPUT"   # cut a new release
            echo "bump=true"     >> "$GITHUB_OUTPUT"
          fi

      - name: Require main for a new release
        if: steps.mode.outputs.bump == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "New releases must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Check out the tag to publish
        # Use the validation supplied by the tag rather than applying current
        # package expectations retrospectively to an older release.
        if: inputs.tag != ''
        run: git checkout "refs/tags/${{ inputs.tag }}"

      - name: Preview bump (dry run)
        if: inputs.tag == '' && inputs.dry_run
        run: |
          uv run cz bump --yes --dry-run
          echo "Dry run only — nothing was published."

      - name: Create version commit and tag locally
        if: steps.mode.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run cz bump --yes --changelog

      - name: Resolve version and release notes
        if: steps.mode.outputs.publish == 'true'
        id: notes
        run: |
          VERSION="$(uv run cz version --project)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Slice the newest CHANGELOG.md section (between the first two `## `
          # headers) for the GitHub Release body. Never fatal.
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > body.md || true
          fi
          [ -s body.md ] || echo "Release $VERSION" > body.md

      - name: Build sdist and wheel
        if: steps.mode.outputs.publish == 'true'
        run: uv build

      - name: Check distribution metadata
        if: steps.mode.outputs.publish == 'true'
        run: uvx twine check --strict dist/*

      - name: Smoke-test wheel
        if: steps.mode.outputs.publish == 'true'
        run: |
          uv run --isolated --no-project --python 3.12 --with ./dist/*.whl \
            python -I tests/distribution/smoke_test.py \
            --expected-version "${{ steps.notes.outputs.version }}"

      - name: Push version commit and tag
        if: steps.mode.outputs.bump == 'true'
        run: |
          # Keep the release commit and its tag all-or-nothing on the remote.
          git push --atomic origin HEAD:main "v${{ steps.notes.outputs.version }}"

      - name: Store validated distributions
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/
            body.md
          if-no-files-found: error

  live:
    # Gate publishing on the credentialed suite passing against a real
    # warehouse. Skipped on a dry run, which never publishes.
    needs: build
    if: needs.build.outputs.publish == 'true'
    uses: ./.github/workflows/live.yaml
    secrets: inherit

  publish:
    needs: [build, live]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/delta-engine/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write # OIDC for Trusted Publishing
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@v5
        with:
          name: release-distributions

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve release notes
        uses: actions/download-artifact@v5
        with:
          name: release-distributions

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          bodyFile: body.md
          skipIfReleaseExists: true
